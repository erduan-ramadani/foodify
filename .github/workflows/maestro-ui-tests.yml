name: Maestro UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  maestro-ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.12.0
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Restore Android system image
        id: android-image-cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-system-image-api34-google-apis-x86_64-v3

      - name: Restore AVD snapshot
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: foodify-avd-api34-google-apis-v1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create AVD snapshot
        id: avd-cache-prepare
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot initialized"

      - name: Run Maestro UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r composeApp/build/outputs/apk/debug/composeApp-debug.apk
            python3 .github/scripts/setup-appcheck.py
            maestro test .maestro/setup/onboarding.yaml
            adb logcat -c
            bash .github/scripts/run-maestro-tests.sh
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true

      - name: Save AVD snapshot
        if: ${{ !cancelled() && steps.avd-cache.outputs.cache-hit != 'true' && steps.avd-cache-prepare.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: foodify-avd-api34-google-apis-v1

      - name: Save Android system image
        if: ${{ !cancelled() && steps.android-image-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-system-image-api34-google-apis-x86_64-v3

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-artifacts
          path: ~/.maestro/tests/
          if-no-files-found: ignore
