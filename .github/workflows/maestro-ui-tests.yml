name: Maestro UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  maestro-ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.12.0
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          path: |
            ${{ env.ANDROID_HOME }}/system-images/android-34/google_apis/x86_64
          key: android-system-image-34-google-apis-x86_64-v1
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r composeApp/build/outputs/apk/debug/composeApp-debug.apk

            maestro test .maestro/setup/onboarding.yaml

            adb logcat -c
            maestro test .maestro || {
              echo "=== Foodify and Firebase errors ==="
              adb logcat -d -v brief |
                grep -Ei 'App attestation failed|FirebaseAppCheck|Antwort failure|403' |
                sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}/[REDACTED]/g' |
                tail -80 || true
              exit 1
            }

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-artifacts
          path: ~/.maestro/tests/
          if-no-files-found: ignore
