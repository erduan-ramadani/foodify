appId: com.eddiapps.foodify
---
- launchApp:
    stopApp: true

- extendedWaitUntil:
    visible:
      id: "day_entry_input"
    timeout: 15000

- tapOn:
    id: "day_entry_input"

- inputText: "1 Birne"

- tapOn:
    id: "day_entry_send"

- extendedWaitUntil:
    visible:
      id: "food_entry_.*"
      containsDescendants:
        - text: "1 Birne"
    timeout: 30000
