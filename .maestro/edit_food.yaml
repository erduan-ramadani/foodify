appId: com.eddiapps.foodify
---
- launchApp:
    stopApp: true

- extendedWaitUntil:
    visible:
      id: "day_entry_input"
    timeout: 15000

# Mango hinzufügen
- tapOn:
    id: "day_entry_input"

- inputText: "1 Mango"

- tapOn:
    id: "day_entry_send"

# Warten, bis Mango hinzugefügt wurde
- extendedWaitUntil:
    visible:
      id: "food_entry_.*"
      containsDescendants:
        - text: "1 Mango"
    timeout: 30000

# Tastatur vor dem Öffnen des Bearbeitungsdialogs schließen
- hideKeyboard

# Mango bearbeiten
- longPressOn:
    id: "food_entry_.*"
    containsDescendants:
      - text: "1 Mango"

- extendedWaitUntil:
    visible:
      id: "edit_food_name"
    timeout: 10000

# Namen ändern
- tapOn:
    id: "edit_food_name"

- eraseText: 30

- inputText: "2 Mangos"

# Tastatur vor dem Speichern schließen
- hideKeyboard

- extendedWaitUntil:
    visible:
      id: "edit_food_save"
    timeout: 10000

- tapOn:
    id: "edit_food_save"

# Geänderten Namen überprüfen
- extendedWaitUntil:
    visible: "2 Mangos"
    timeout: 10000

- assertNotVisible: "1 Mango"
