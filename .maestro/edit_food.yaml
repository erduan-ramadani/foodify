appId: com.eddiapps.foodify
---
- launchApp

- extendedWaitUntil:
    visible:
      id: "day_entry_input"
    timeout: 15000

# Lebensmittel hinzufügen
- tapOn:
    id: "day_entry_input"

- inputText: "1 Mango"

- tapOn:
    id: "day_entry_send"

- extendedWaitUntil:
    visible: "1 Mango"
    timeout: 30000

# Lebensmittel bearbeiten
- longPressOn:
    text: "1 Mango"

- extendedWaitUntil:
    visible:
      id: "edit_food_name"
    timeout: 5000

# Namen ändern
- tapOn:
    id: "edit_food_name"

- eraseText: 30

- inputText: "2 Mangos"

# Tastatur schließen
- hideKeyboard

# Speichern-Button abwarten
- extendedWaitUntil:
    visible:
      id: "edit_food_save"
    timeout: 10000

# Änderungen speichern
- tapOn:
    id: "edit_food_save"

# Ergebnis überprüfen
- extendedWaitUntil:
    visible: "2 Mangos"
    timeout: 10000

- assertNotVisible: "1 Mango"
