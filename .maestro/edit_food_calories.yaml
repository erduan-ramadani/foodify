appId: com.eddiapps.foodify
---
- launchApp

# Warten, bis der DayScreen sichtbar ist
- extendedWaitUntil:
    visible:
      id: "day_entry_input"
    timeout: 15000

# Lebensmittel hinzufügen
- tapOn:
    id: "day_entry_input"

- inputText: "1 Banane"

- tapOn:
    id: "day_entry_send"

- extendedWaitUntil:
    visible: "1 Banane"
    timeout: 30000

# Lebensmittel bearbeiten
- longPressOn:
    text: "1 Banane"

- extendedWaitUntil:
    visible:
      id: "edit_food_calories"
    timeout: 5000

# Kalorien ändern
- tapOn:
    id: "edit_food_calories"

- eraseText: 20

- inputText: "150"

# Speichern
- hideKeyboard

- extendedWaitUntil:
    visible:
      id: "edit_food_save"
    timeout: 10000

- tapOn:
    id: "edit_food_save"

# Prüfen, ob ein Eintrag mit Titel und Kalorienwert existiert
- extendedWaitUntil:
    visible:
      id: "food_entry_.*"
      containsDescendants:
        - text: "1 Banane"
        - text: "+150"
    timeout: 10000
