appId: com.eddiapps.foodify
---
- launchApp

- extendedWaitUntil:
    visible:
      id: "day_entry_input"
    timeout: 15000

# Lebensmittel hinzufügen
- tapOn:
    id: "day_entry_input"

- inputText: "1 Banane"

- tapOn:
    id: "day_entry_send"

- extendedWaitUntil:
    visible: "1 Banane"
    timeout: 30000

# Lebensmittel bearbeiten
- longPressOn:
    text: "1 Banane"

- extendedWaitUntil:
    visible:
      id: "edit_food_calories"
    timeout: 5000

# Kalorien ändern
- tapOn:
    id: "edit_food_calories"

- eraseText: 20

- inputText: "150"

# Änderungen speichern
- tapOn:
    id: "edit_food_save"

# Ergebnis überprüfen
- extendedWaitUntil:
    visible: "1 Banane"
    timeout: 10000

- assertVisible: "+150"
