appId: com.eddiapps.foodify
---
- launchApp

# Warten, bis das Onboarding oder Dashboard erscheint
- extendedWaitUntil:
    visible:
      id: "onboarding_gender_male|day_entry_input"
    timeout: 30000

# Onboarding nur beim ersten App-Start ausführen
- runFlow:
    when:
      visible:
        id: "onboarding_gender_male"
    commands:

      # Seite 1: Persönliche Daten
      - tapOn:
          id: "onboarding_gender_male"

      - tapOn:
          id: "onboarding_next_button"

      # Seite 2: Aktivitätslevel
      - extendedWaitUntil:
          visible:
            id: "onboarding_activity_sedentary"
          timeout: 10000

      - tapOn:
          id: "onboarding_activity_sedentary"

      - tapOn:
          id: "onboarding_next_button"

      # Seite 3: Gewichtsziel
      - extendedWaitUntil:
          visible:
            id: "onboarding_next_button"
          timeout: 10000

      - tapOn:
          id: "onboarding_next_button"

# Dashboard muss nach dem Onboarding sichtbar sein
- extendedWaitUntil:
    visible:
      id: "day_entry_input"
    timeout: 30000
