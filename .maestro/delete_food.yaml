appId: com.eddiapps.foodify
---
- launchApp:
    stopApp: true

- extendedWaitUntil:
    visible:
      id: "day_entry_input"
    timeout: 15000

- tapOn:
    id: "day_entry_input"

- inputText: "1 Kiwi"

- tapOn:
    id: "day_entry_send"

- extendedWaitUntil:
    visible: "1 Kiwi"
    timeout: 30000

- longPressOn:
    text: "1 Kiwi"
- extendedWaitUntil:
    visible:
      id: "delete_food_button"
    timeout: 5000

- tapOn:
    id: "delete_food_button"

- extendedWaitUntil:
    notVisible: "1 Kiwi"
    timeout: 10000